<!DOCTYPE html>
<html>
<head>
    <title>Тест печати чека с маркировкой</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        .button.secondary {
            background-color: #2196F3;
        }
        .button.danger {
            background-color: #f44336;
        }
        .button.small {
            padding: 5px 10px;
            font-size: 12px;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .item-row {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .item-title {
            font-weight: bold;
            font-size: 16px;
        }
        .item-controls {
            display: flex;
            gap: 10px;
        }
        .item-fields {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .marking-section {
            background-color: #e8f4fd;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .marking-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        .marking-status {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin: 2px;
        }
        .status-not_checked {
            background-color: #e2e3e5;
            color: #6c757d;
        }
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-success {
            background-color: #d4edda;
            color: #155724;
        }
        .status-error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .marking-type {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        .marking-type-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        .marking-type-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 5px;
        }
        .user-result {
            font-weight: bold;
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
            background-color: #e9ecef;
        }
        .machine-data {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }
        .check-summary {
            background-color: #f0f8ff;
            padding: 15px;
            border: 1px solid #b0d4f1;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .summary-total {
            font-weight: bold;
            font-size: 18px;
            border-top: 2px solid #333;
            padding-top: 10px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2196F3;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .check-type-indicator {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .check-type-sell {
            background-color: #d4edda;
            color: #155724;
        }
        .check-type-return {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <a href="test_fetchs.html" class="back-link">← Вернуться к основным тестам</a>
    
    <h1>Тест печати чека с маркировкой <span id="checkTypeIndicator" class="check-type-indicator check-type-sell">Продажа</span></h1>
    
    <div class="check-summary">
        <h3>Сводка по чеку</h3>
        <div class="summary-row">
            <span>Количество позиций:</span>
            <span id="itemsCount">0</span>
        </div>
        <div class="summary-row">
            <span>Сумма наличными:</span>
            <span id="cashTotal">0.00 ₽</span>
        </div>
        <div class="summary-row">
            <span>Сумма безналом:</span>
            <span id="cardTotal">0.00 ₽</span>
        </div>
        <div class="summary-total">
            <span>Итого:</span>
            <span id="grandTotal">0.00 ₽</span>
        </div>
    </div>

    <div id="itemsContainer">
        <!-- Глобальная панель проверки марок -->
        <div id="globalCheckPanel" style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 4px; background-color: #f9f9f9;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                <h3 style="margin: 0;">Проверка марок</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="button secondary" onclick="checkAllMarks()" id="checkAllButton">Запустить все проверки</button>
                    <div id="globalCheckStatus" class="marking-status status-not_checked">Все марки: Не проверено</div>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; font-size: 14px;">
                <div>
                    <strong>ККТ:</strong> 
                    <span id="kktGlobalStatus" class="marking-status status-not_checked">Не проверено</span>
                </div>
                <div>
                    <strong>Разрешение:</strong> 
                    <span id="permitGlobalStatus" class="marking-status status-not_checked">Не проверено</span>
                </div>
            </div>
        </div>
        <!-- Позиции будут добавляться динамически -->
    </div>

    <div style="margin-top: 20px;">
        <button class="button" onclick="addItem()">Добавить позицию</button>
        <button class="button secondary" onclick="addMarkedItem()">Добавить позицию с маркой</button>
        <button class="button danger" onclick="clearAllItems()">Очистить все</button>
    </div>

    <div style="margin-top: 30px;">
        <h3>Печать чека</h3>
        <div class="form-group">
            <label for="cashierName">Имя кассира:</label>
            <input type="text" id="cashierName" value="Иван Иванов">
        </div>
        <div class="form-group">
            <label for="checkType">Тип чека:</label>
            <select id="checkType" onchange="updateCheckType()">
                <option value="sell">Продажа</option>
                <option value="return">Возврат</option>
            </select>
        </div>
        <button class="button" onclick="printCheck()" style="font-size: 18px; padding: 15px 30px;">Отправить чек на печать</button>
    </div>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        const API_URL = 'http://localhost:8000';
        let itemCounter = 0;
        let items = [];

        // Шаблоны тестовых данных
        const testItems = [
            { name: "Хлеб белый", price: 45.50, quantity: 2, markingCode: "" },
            { name: "Молоко 1л", price: 89.90, quantity: 1, markingCode: "0104607008480429215KpOL.jHnx6Xm\u001d93kl/E" },
            { name: "Сыр российский", price: 320.00, quantity: 1, markingCode: "0104607008480429215KpOL.jHnx6Xm\u001d93kl/E" },
            { name: "Колбаса докторская", price: 450.00, quantity: 1, markingCode: "0104607008480429215KpOL.jHnx6Xm\u001d93kl/E" },
            { name: "Яблоки", price: 120.00, quantity: 3, markingCode: "" }
        ];

        function addItem() {
            const testItem = testItems[itemCounter % testItems.length];
            addItemToContainer(testItem.name, testItem.price, testItem.quantity, "", false);
        }

        function addMarkedItem() {
            const testItem = testItems[itemCounter % testItems.length];
            addItemToContainer(testItem.name, testItem.price, testItem.quantity, testItem.markingCode, true);
        }

        function addItemToContainer(name, price, quantity, markingCode, hasMarking) {
            const itemId = `item_${itemCounter++}`;
            const item = {
                id: itemId,
                name: name,
                price: parseFloat(price),
                quantity: parseInt(quantity),
                markingCode: markingCode,
                hasMarking: hasMarking,
                kktCheck: {
                    status: hasMarking ? 'not_checked' : null,
                    result: null,
                    userResult: null,
                    machineData: null
                },
                permitCheck: {
                    status: hasMarking ? 'not_checked' : null,
                    result: null,
                    userResult: null,
                    machineData: null
                }
            };
            items.push(item);
            renderItem(item);
            updateSummary();
        }

        function renderItem(item) {
            const container = document.getElementById('itemsContainer');
            let itemDiv = document.getElementById(item.id);
            
            if (!itemDiv) {
                itemDiv = document.createElement('div');
                itemDiv.className = 'item-row';
                itemDiv.id = item.id;
                container.appendChild(itemDiv);
            }

            // Убираем статусы из заголовка - они будут в табло марки

            const itemHtml = `
                <div class="item-header">
                    <div class="item-title">Позиция ${items.indexOf(item) + 1}</div>
                    <div class="item-controls">
                        <button class="button danger small" onclick="removeItem('${item.id}')">Удалить</button>
                    </div>
                </div>
                <div class="item-fields">
                    <div class="form-group">
                        <label>Название</label>
                        <input type="text" value="${item.name}" onchange="updateItem('${item.id}', 'name', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Цена</label>
                        <input type="number" step="0.01" value="${item.price}" onchange="updateItem('${item.id}', 'price', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Количество</label>
                        <input type="number" value="${item.quantity}" onchange="updateItem('${item.id}', 'quantity', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Сумма</label>
                        <input type="text" value="${(item.price * item.quantity).toFixed(2)} ₽" readonly>
                    </div>
                </div>
                ${item.hasMarking ? `
                    <div class="marking-section">
                        <div class="form-group">
                            <label>Код маркировки</label>
                            <input type="text" value="${item.markingCode}" onchange="updateItem('${item.id}', 'markingCode', this.value)" placeholder="Введите код маркировки">
                        </div>
                        
                        <div class="marking-type">
                            <div class="marking-type-title">
                                Проверка на ККТ
                                ${item.kktCheck.status ? 
                                    `<span class="marking-status status-${item.kktCheck.status}" style="margin-left: 10px;">
                                        ${item.kktCheck.status === 'not_checked' ? 'Не проверена' : 
                                          item.kktCheck.status === 'pending' ? 'Проверяется' : 
                                          item.kktCheck.status === 'success' ? 'Проверена ✓' : 'Ошибка ✗'}
                                    </span>` : ''}
                            </div>
                            <div class="marking-type-controls">
                                <button class="button small" onclick="checkMarkingKKT('${item.id}')" ${item.kktCheck.status === 'pending' ? 'disabled' : ''}>
                                    ${item.kktCheck.status === 'pending' ? 'Проверяется...' : 'Проверить на ККТ'}
                                </button>
                            </div>
                            <div class="info-board" style="margin-top: 10px; padding: 10px; background-color: #f8f9fa; border-radius: 4px; min-height: 50px;">
                                ${item.kktCheck.userResult ? `
                                    <div class="user-result">${item.kktCheck.userResult}</div>
                                    <div class="machine-data">
                                        <strong>Машинные данные:</strong><br>
                                        <pre style="font-size: 10px; margin: 2px 0;">${JSON.stringify(item.kktCheck.machineData, null, 2)}</pre>
                                    </div>
                                ` : '<div style="color: #6c757d; font-style: italic;">Результат проверки будет отображен здесь</div>'}
                            </div>
                        </div>
                        
                        <div class="marking-type">
                            <div class="marking-type-title">
                                Проверка разрешительного режима
                                ${item.permitCheck.status ? 
                                    `<span class="marking-status status-${item.permitCheck.status}" style="margin-left: 10px;">
                                        ${item.permitCheck.status === 'not_checked' ? 'Не проверено' : 
                                          item.permitCheck.status === 'pending' ? 'Проверяется' : 
                                          item.permitCheck.status === 'success' ? 'Проверено ✓' : 'Ошибка ✗'}
                                    </span>` : ''}
                            </div>
                            <div class="marking-type-controls">
                                <button class="button small" onclick="checkMarkingPermit('${item.id}')" ${item.permitCheck.status === 'pending' ? 'disabled' : ''}>
                                    ${item.permitCheck.status === 'pending' ? 'Проверяется...' : 'Проверить разрешение'}
                                </button>
                            </div>
                            <div class="info-board" style="margin-top: 10px; padding: 10px; background-color: #f8f9fa; border-radius: 4px; min-height: 50px;">
                                ${item.permitCheck.userResult ? `
                                    <div class="user-result">${item.permitCheck.userResult}</div>
                                    <div class="machine-data">
                                        <strong>Машинные данные:</strong><br>
                                        <pre style="font-size: 10px; margin: 2px 0;">${JSON.stringify(item.permitCheck.machineData, null, 2)}</pre>
                                    </div>
                                ` : '<div style="color: #6c757d; font-style: italic;">Результат проверки будет отображен здесь</div>'}
                            </div>
                        </div>
                        
                        <div class="marking-controls">
                            <button class="button secondary small" onclick="toggleMarking('${item.id}')">
                                Убрать маркировку
                            </button>
                        </div>
                    </div>
                ` : `
                    <div style="text-align: center; margin-top: 10px;">
                        <button class="button secondary small" onclick="toggleMarking('${item.id}')">Добавить маркировку</button>
                    </div>
                `}
            `;
            
            // Обновляем содержимое элемента
            itemDiv.innerHTML = itemHtml;
        }

        function updateItem(itemId, field, value) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            if (field === 'price' || field === 'quantity') {
                item[field] = parseFloat(value);
            } else {
                item[field] = value;
            }

            // Перерисовываем позицию
            renderItem(item);
            updateSummary();
        }

        function toggleMarking(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item) return;

            item.hasMarking = !item.hasMarking;
            if (!item.hasMarking) {
                item.markingCode = '';
                item.kktCheck = { status: null, result: null, userResult: null, machineData: null };
                item.permitCheck = { status: null, result: null, userResult: null, machineData: null };
            } else {
                item.markingCode = testItems[0].markingCode; // Устанавливаем тестовый код
                item.kktCheck = { status: 'not_checked', result: null, userResult: null, machineData: null };
                item.permitCheck = { status: 'not_checked', result: null, userResult: null, machineData: null };
            }

            // Перерисовываем позицию
            renderItem(item);
            updateGlobalCheckStatus();
        }

        async function checkMarkingKKT(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item || !item.markingCode) return;

            item.kktCheck.status = 'pending';
            renderItem(item);

            const checkType = document.getElementById('checkType').value;

            try {
                const response = await fetch(`${API_URL}/api/check-marking-code`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        markingCode: item.markingCode,
                        sellOrReturn: checkType
                    })
                });
                const data = await response.json();
                
                item.kktCheck.status = data.success ? 'success' : 'error';
                item.kktCheck.result = data;
                
                // Обрабатываем результат для пользователя
                if (data.success && data.data && data.data.success) {
                    const responseData = data.data.response;
                    if (responseData && responseData.itemInfoCheckResult) {
                        const checkResult = responseData.itemInfoCheckResult;
                        if (checkResult.imcCheckResult) {
                            item.kktCheck.userResult = '[М+] Марка проверена успешно';
                        } else {
                            item.kktCheck.userResult = '[М-] Марка не прошла проверку';
                        }
                    } else {
                        item.kktCheck.userResult = '[М] Марка обработана';
                    }
                    item.kktCheck.machineData = data.data.response;
                } else {
                    item.kktCheck.userResult = '[М-] Ошибка проверки марки';
                    item.kktCheck.machineData = data;
                }
                
                renderItem(item);
                updateGlobalCheckStatus();
            } catch (error) {
                item.kktCheck.status = 'error';
                item.kktCheck.userResult = '[М-] Ошибка: ' + error.message;
                item.kktCheck.machineData = { error: error.message };
                renderItem(item);
                updateGlobalCheckStatus();
            }
        }

        async function checkMarkingPermit(itemId) {
            const item = items.find(i => i.id === itemId);
            if (!item || !item.markingCode) return;

            item.permitCheck.status = 'pending';
            renderItem(item);

            const checkType = document.getElementById('checkType').value;

            try {
                const response = await fetch(`${API_URL}/api/check-permit-mark`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        permitMark: item.markingCode,
                        sellOrReturn: checkType
                    })
                });
                const data = await response.json();
                
                item.permitCheck.status = data.success ? 'success' : 'error';
                item.permitCheck.result = data;
                
                // Обрабатываем результат для пользователя
                if (data.success) {
                    // Для возврата проверка разрешительного режима не требуется
                    if (checkType === 'return') {
                        item.permitCheck.userResult = '✓ Проверка не требуется (возврат)';
                        item.permitCheck.machineData = { note: 'Для возврата товаров проверка разрешительного режима не требуется' };
                    } else if (data.data && data.data.success) {
                        const responseData = data.data.response;
                        if (responseData && responseData.user_status) {
                            if (responseData.user_status.ok) {
                                item.permitCheck.userResult = '✓ Разрешено к продаже';
                            } else {
                                item.permitCheck.userResult = '✗ Не разрешено: ' + (responseData.user_status.text || 'Неизвестная причина');
                            }
                        } else {
                            item.permitCheck.userResult = '✓ Разрешено к продаже';
                        }
                        item.permitCheck.machineData = {
                            code: responseData.machine_data?.code,
                            uuid: responseData.machine_data?.uuid || 'N/A',
                            timeStamp: responseData.machine_data?.timeStamp || 'N/A',
                            ver: responseData.machine_data?.ver || 'N/A',
                            inst: responseData.machine_data?.inst || 'N/A'
                        };
                    } else {
                        item.permitCheck.userResult = '✓ Разрешено к продаже';
                        item.permitCheck.machineData = data;
                    }
                } else {
                    item.permitCheck.userResult = '✗ Ошибка проверки разрешения';
                    item.permitCheck.machineData = data;
                }
                
                renderItem(item);
                updateGlobalCheckStatus();
            } catch (error) {
                item.permitCheck.status = 'error';
                item.permitCheck.userResult = '✗ Ошибка: ' + error.message;
                item.permitCheck.machineData = { error: error.message };
                renderItem(item);
                updateGlobalCheckStatus();
            }
        }

        function removeItem(itemId) {
            items = items.filter(i => i.id !== itemId);
            document.getElementById(itemId).remove();
            updateSummary();
        }

        function clearAllItems() {
            if (confirm('Вы уверены, что хотите удалить все позиции?')) {
                items = [];
                const container = document.getElementById('itemsContainer');
                const globalPanel = document.getElementById('globalCheckPanel');
                
                // Очищаем контейнер, но сохраняем глобальную панель
                container.innerHTML = '';
                if (globalPanel) {
                    container.appendChild(globalPanel);
                }
                updateSummary();
            }
        }

        function updateSummary() {
            const itemsCount = items.length;
            const cashTotal = items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cardTotal = 0; // Пока только наличные

            document.getElementById('itemsCount').textContent = itemsCount;
            document.getElementById('cashTotal').textContent = cashTotal.toFixed(2) + ' ₽';
            document.getElementById('cardTotal').textContent = cardTotal.toFixed(2) + ' ₽';
            document.getElementById('grandTotal').textContent = (cashTotal + cardTotal).toFixed(2) + ' ₽';
            
            // Обновляем глобальные статусы проверки
            updateGlobalCheckStatus();
        }

        function updateCheckType() {
            const checkType = document.getElementById('checkType').value;
            const checkTypeText = checkType === 'sell' ? 'Продажа' : 'Возврат';
            
            // Обновляем индикатор типа чека
            const indicator = document.getElementById('checkTypeIndicator');
            indicator.textContent = checkTypeText;
            indicator.className = `check-type-indicator check-type-${checkType}`;
            
            // Сбрасываем статусы проверки марок, так как тип чека изменился
            items.forEach(item => {
                if (item.hasMarking) {
                    item.kktCheck = { status: 'not_checked', result: null, userResult: null, machineData: null };
                    item.permitCheck = { status: 'not_checked', result: null, userResult: null, machineData: null };
                    renderItem(item);
                }
            });
            
            updateGlobalCheckStatus();
        }

        function updateGlobalCheckStatus() {
            const markedItems = items.filter(item => item.hasMarking);
            
            // Проверяем, что элементы существуют
            const globalCheckStatus = document.getElementById('globalCheckStatus');
            const kktGlobalStatus = document.getElementById('kktGlobalStatus');
            const permitGlobalStatus = document.getElementById('permitGlobalStatus');
            
            if (!globalCheckStatus || !kktGlobalStatus || !permitGlobalStatus) {
                return; // Элементы не найдены, выходим
            }
            
            if (markedItems.length === 0) {
                globalCheckStatus.textContent = 'Все марки: Нет марок';
                globalCheckStatus.className = 'marking-status status-not_checked';
                kktGlobalStatus.textContent = 'Нет марок';
                kktGlobalStatus.className = 'marking-status status-not_checked';
                permitGlobalStatus.textContent = 'Нет марок';
                permitGlobalStatus.className = 'marking-status status-not_checked';
                return;
            }

            // Статус ККТ проверки
            const kktStatuses = markedItems.map(item => item.kktCheck.status).filter(status => status);
            const kktNotChecked = kktStatuses.filter(status => status === 'not_checked').length;
            const kktPending = kktStatuses.filter(status => status === 'pending').length;
            const kktSuccess = kktStatuses.filter(status => status === 'success').length;
            const kktError = kktStatuses.filter(status => status === 'error').length;

            if (kktPending > 0) {
                kktGlobalStatus.textContent = `Проверяется (${kktPending})`;
                kktGlobalStatus.className = 'marking-status status-pending';
            } else if (kktError > 0) {
                kktGlobalStatus.textContent = `Ошибки (${kktError})`;
                kktGlobalStatus.className = 'marking-status status-error';
            } else if (kktSuccess === kktStatuses.length) {
                kktGlobalStatus.textContent = `Проверено (${kktSuccess})`;
                kktGlobalStatus.className = 'marking-status status-success';
            } else {
                kktGlobalStatus.textContent = `Не проверено (${kktNotChecked})`;
                kktGlobalStatus.className = 'marking-status status-not_checked';
            }

            // Статус разрешительного режима
            const permitStatuses = markedItems.map(item => item.permitCheck.status).filter(status => status);
            const permitNotChecked = permitStatuses.filter(status => status === 'not_checked').length;
            const permitPending = permitStatuses.filter(status => status === 'pending').length;
            const permitSuccess = permitStatuses.filter(status => status === 'success').length;
            const permitError = permitStatuses.filter(status => status === 'error').length;

            if (permitPending > 0) {
                permitGlobalStatus.textContent = `Проверяется (${permitPending})`;
                permitGlobalStatus.className = 'marking-status status-pending';
            } else if (permitError > 0) {
                permitGlobalStatus.textContent = `Ошибки (${permitError})`;
                permitGlobalStatus.className = 'marking-status status-error';
            } else if (permitSuccess === permitStatuses.length) {
                permitGlobalStatus.textContent = `Проверено (${permitSuccess})`;
                permitGlobalStatus.className = 'marking-status status-success';
            } else {
                permitGlobalStatus.textContent = `Не проверено (${permitNotChecked})`;
                permitGlobalStatus.className = 'marking-status status-not_checked';
            }

            // Общий статус
            const totalPending = kktPending + permitPending;
            const totalError = kktError + permitError;
            const totalSuccess = kktSuccess + permitSuccess;
            const totalNotChecked = kktNotChecked + permitNotChecked;

            if (totalPending > 0) {
                globalCheckStatus.textContent = `Все марки: Проверяется (${totalPending})`;
                globalCheckStatus.className = 'marking-status status-pending';
            } else if (totalError > 0) {
                globalCheckStatus.textContent = `Все марки: Ошибки (${totalError})`;
                globalCheckStatus.className = 'marking-status status-error';
            } else if (totalSuccess === (kktStatuses.length + permitStatuses.length)) {
                globalCheckStatus.textContent = `Все марки: Проверено (${totalSuccess})`;
                globalCheckStatus.className = 'marking-status status-success';
            } else {
                globalCheckStatus.textContent = `Все марки: Не проверено (${totalNotChecked})`;
                globalCheckStatus.className = 'marking-status status-not_checked';
            }
        }

        async function checkAllMarks() {
            const markedItems = items.filter(item => item.hasMarking);
            
            if (markedItems.length === 0) {
                alert('Нет позиций с маркировкой для проверки');
                return;
            }

            const checkAllButton = document.getElementById('checkAllButton');
            checkAllButton.disabled = true;
            checkAllButton.textContent = 'Проверяется...';

            const checkType = document.getElementById('checkType').value;
            
            // Запускаем все проверки параллельно
            const allChecks = [];
            
            for (const item of markedItems) {
                if (item.kktCheck.status === 'not_checked') {
                    allChecks.push(checkMarkingKKT(item.id));
                }
                // Для возврата проверка разрешительного режима не требуется
                if (checkType === 'sell' && item.permitCheck.status === 'not_checked') {
                    allChecks.push(checkMarkingPermit(item.id));
                } else if (checkType === 'return' && item.permitCheck.status === 'not_checked') {
                    // Для возврата автоматически помечаем как успешную проверку
                    item.permitCheck.status = 'success';
                    item.permitCheck.userResult = '✓ Проверка не требуется (возврат)';
                    item.permitCheck.machineData = { note: 'Для возврата товаров проверка разрешительного режима не требуется' };
                    renderItem(item);
                }
            }

            try {
                await Promise.all(allChecks);
            } catch (error) {
                console.error('Ошибка при проверке марок:', error);
            } finally {
                checkAllButton.disabled = false;
                checkAllButton.textContent = 'Запустить все проверки';
                updateGlobalCheckStatus();
            }
        }

        async function printCheck() {
            if (items.length === 0) {
                alert('Добавьте хотя бы одну позицию в чек');
                return;
            }

            const cashierName = document.getElementById('cashierName').value.trim();
            if (!cashierName) {
                alert('Введите имя кассира');
                return;
            }

            // Проверяем, что все марки проверены
            const uncheckedKKT = items.filter(item => item.hasMarking && (item.kktCheck.status === 'not_checked' || item.kktCheck.status === 'pending'));
            const checkType = document.getElementById('checkType').value;
            const uncheckedPermit = checkType === 'sell' ? 
                items.filter(item => item.hasMarking && (item.permitCheck.status === 'not_checked' || item.permitCheck.status === 'pending')) : 
                []; // Для возврата проверка разрешительного режима не требуется
            
            if (uncheckedKKT.length > 0 || uncheckedPermit.length > 0) {
                let message = 'Есть непроверенные марки:\n';
                if (uncheckedKKT.length > 0) message += `- ККТ: ${uncheckedKKT.length} шт.\n`;
                if (uncheckedPermit.length > 0) message += `- Разрешение: ${uncheckedPermit.length} шт.\n`;
                message += '\nПродолжить печать?';
                
                if (!confirm(message)) {
                    return;
                }
            }

            const checkData = {
                tableData: items.map(item => ({
                    name: item.name,
                    quantity: item.quantity.toString(),
                    price: item.price.toFixed(2),
                    ...(item.hasMarking ? {
                        markingCode: item.markingCode,
                        itemEstimatedStatus: checkType === 'sell' ? 'itemPieceSold' : 'itemPieceReturn',
                        ...(item.kktCheck.status && (item.kktCheck.status === 'success' || item.kktCheck.status === 'error') ? {
                            kktCheckResult: {
                                status: item.kktCheck.status,
                                userResult: item.kktCheck.userResult,
                                machineData: item.kktCheck.machineData
                            }
                        } : {}),
                        ...(item.permitCheck.status && (item.permitCheck.status === 'success' || item.permitCheck.status === 'error') ? {
                            permitCheckResult: {
                                status: item.permitCheck.status,
                                userResult: item.permitCheck.userResult,
                                machineData: item.permitCheck.machineData
                            }
                        } : {})
                    } : {})
                })),
                cashier: cashierName,
                payments: [
                    {
                        type: 'cash',
                        amount: parseFloat(document.getElementById('grandTotal').textContent.replace(' ₽', ''))
                    }
                ],
                type: checkType
            };

            try {
                const response = await fetch(`${API_URL}/api/print-check`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(checkData)
                });
                const data = await response.json();
                
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3>Результат печати чека:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `
                    <h3>Ошибка печати чека:</h3>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }

        // Инициализация - добавляем одну тестовую позицию
        window.onload = function() {
            addItem();
        };
    </script>
</body>
