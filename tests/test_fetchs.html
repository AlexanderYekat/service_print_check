        <input type="text" id="markInput" placeholder="Введите код марки" style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;" value="0104607008480429215KpOL.jHnx6Xm93kl/E">

    <div id="status_display" class="result" style="background-color: #f0f0f0; border-color: #ccc;"></div>
    <div id="saved_slip_display" class="result" style="background-color: #e0ffe0; border-color: #ccffcc;"><h3>Сохраненный банковский слип:</h3><pre id="slip_content"></pre></div>
    <div id="result" class="result"></div>

    <!-- Подключаем класс BarcodeScanner -->
    <script src="/scanner/barcode-scanner.js"></script>
    
    <script>
        //const API_URL = 'http://localhost:8081';
        const API_URL = 'http://localhost:8000';

        let savedSlipLines = []; // Глобальная переменная для хранения строк слипа
        let scanner = null; // Глобальная переменная для сканера


        function displaySavedSlip() {
            console.log('displaySavedSlip called. Current savedSlipLines:', savedSlipLines);
            const slipContentElement = document.getElementById('slip_content');
            const savedSlipDisplayElement = document.getElementById('saved_slip_display');

            if (savedSlipLines.length > 0) {
                slipContentElement.textContent = savedSlipLines.join('\n');
                savedSlipDisplayElement.style.display = 'block';
            } else {
                slipContentElement.textContent = 'Нет сохраненного слипа.';
                savedSlipDisplayElement.style.display = 'none'; // Скрываем блок, если нет слипа
            }
        }

        // Функции для работы со сканером
        function updateScannerStatus(message, isConnected = false) {
            const statusText = document.getElementById('scannerStatusText');
            const connectBtn = document.querySelector('button[onclick="connectScanner()"]');
            const disconnectBtn = document.querySelector('button[onclick="disconnectScanner()"]');
            
            statusText.textContent = message;
            statusText.style.color = isConnected ? 'green' : 'red';
            
            connectBtn.style.display = isConnected ? 'none' : 'inline-block';
            disconnectBtn.style.display = isConnected ? 'inline-block' : 'none';
        }

        async function connectScanner() {
            try {
                // Получаем настройки с сервера
                const response = await fetch(`${API_URL}/api/settings`);
                if (!response.ok) {
                    updateScannerStatus('❌ Не удалось загрузить настройки', false);
                    return;
                }
                
                const settings = await response.json();
                await connectScannerWithSettings(settings);
                
            } catch (error) {
                if (error.name === 'NotAllowedError') {
                    updateScannerStatus('❌ Разрешение на подключение отклонено', false);
                } else {
                    updateScannerStatus(`❌ Ошибка подключения: ${error.message}`, false);
                }
            }
        }

        async function disconnectScanner() {
            try {
                if (scanner) {
                    await scanner.disconnect();
                    scanner = null;
                }
                updateScannerStatus('❌ Сканер отключен', false);
            } catch (error) {
                updateScannerStatus(`❌ Ошибка отключения: ${error.message}`, false);
            }
        }

        // Автоматическое подключение сканера при загрузке страницы
        async function initScanner() {
            try {
                // Получаем настройки с сервера
                const response = await fetch(`${API_URL}/api/settings`);
                if (!response.ok) {
                    updateScannerStatus('📱 Не удалось загрузить настройки', false);
                    return;
                }
                
                const settings = await response.json();
                
                // Проверяем, настроен ли сканер
                if (settings.comScanner && settings.comScanner > 0) {
                    console.log('Найден настроенный сканер, подключаемся автоматически');
                    await connectScannerWithSettings(settings);
                } else {
                    updateScannerStatus('📱 Сканер не настроен', false);
                }
            } catch (error) {
                console.error('Ошибка при инициализации сканера:', error);
                updateScannerStatus('📱 Сканер не настроен', false);
            }
        }

        // Подключение сканера с учетом настроек сервера
        async function connectScannerWithSettings(settings) {
            try {
                if (!('serial' in navigator)) {
                    updateScannerStatus('❌ Web Serial API не поддерживается', false);
                    return;
                }

                updateScannerStatus('🔄 Подключение к сканеру...', false);

                // Логируем настройки терминатора для отладки
                console.log('Настройки терминатора с сервера:', settings.scannerSuffix);
                console.log('Тип терминатора:', typeof settings.scannerSuffix);
                console.log('Коды символов терминатора:', Array.from(settings.scannerSuffix || '').map(c => c.charCodeAt(0)));

                // Создаем экземпляр сканера - терминатор обрабатывается внутри класса
                scanner = new BarcodeScanner({
                    onScan: (code) => {
                        // Автоматически заполняем поле марки
                        const markInput = document.getElementById('markInput');
                        markInput.value = code;
                        markInput.style.backgroundColor = '#e8f5e8'; // Подсвечиваем зеленым
                        
                        // Убираем подсветку через 2 секунды
                        setTimeout(() => {
                            markInput.style.backgroundColor = '';
                        }, 2000);
                        
                        updateScannerStatus('✅ Сканер подключен - отсканирован код!', true);
                        console.log('Отсканирован код:', code);
                    },
                    onConnect: () => {
                        updateScannerStatus('✅ Сканер подключен', true);
                    },
                    onDisconnect: () => {
                        updateScannerStatus('❌ Сканер отключен', false);
                    },
                    onError: (message, error) => {
                        updateScannerStatus(`❌ Ошибка: ${message}`, false);
                        console.error('Ошибка сканера:', message, error);
                    },
                    terminator: settings.scannerSuffix || '\t', // Передаем сырой терминатор - класс сам его обработает
                    baudRate: 9600,
                    debug: true,
                    maxBufferSize: 20480,
                    bufferTimeout: 600000
                });

                // Пытаемся подключиться к сохраненному порту
                const savedPortInfo = await scanner.loadSavedPortInfo();
                if (savedPortInfo) {
                    await scanner.connect({
                        trySavedPortFirst: true,
                        savedPortInfo: savedPortInfo
                    });
                } else {
                    await scanner.connect();
                }

            } catch (error) {
                if (error.name === 'NotAllowedError') {
                    updateScannerStatus('❌ Разрешение на подключение отклонено', false);
                } else {
                    updateScannerStatus(`❌ Ошибка подключения: ${error.message}`, false);
                }
            }
        }

        function handleJsonResponse(data, resultElementId) {
            const resultElement = document.getElementById(resultElementId);
            if (typeof data !== 'object' || data === null || !('success' in data)) {
                resultElement.textContent = new Date().toLocaleString() + ': Ошибка: Неверный формат ответа от сервера: ' + JSON.stringify(data);
                return;
            }

            let displayMessage = '';

            if (data.success) {
                displayMessage += `Команда отправлена на устройство.`;
                if (data.data) {
                    if ('success' in data.data) { // Для операций с дополнительным полем "success" в data
                        if (data.data.success) {
                            displayMessage += `\nОперация выполнена успешно. Ответ: ${JSON.stringify(data.data.response, null, 2)}`;
                        } else {
                            displayMessage += `\nОшибка выполнения операции: ${data.data.response}`;
                        }
                    } else if ('weight' in data.data) { // Для получения веса
                        displayMessage += `\nВес: ${data.data.weight}`;
                    } else {
                        displayMessage += `\nДанные: ${JSON.stringify(data.data, null, 2)}`;
                    }
                }
            } else {
                displayMessage += `Ошибка отправки команды на устройство: ${data.message || 'Неизвестная ошибка'}`;
            }

            resultElement.textContent = new Date().toLocaleString() + ': ' + displayMessage;
            console.log('Processed response:', data);
        }

        async function printCheck() {

                console.log('printCheck');
                const response = await fetch(`${API_URL}/api/print-check`, {

                    headers: {

                                price: '100.00'
                            },

                                name: 'Товар 2',
                                quantity: '1',
                                price: '200.00'
                            }
                        ],
                        cashier: 'Иван Иванов',
                        payments: [
                            {
                                type: 'cash',
                                amount: 300.00
                            },
                            {
                                type: 'electronically',
                                amount: 100.00
                            }
                        ],
                        type: 'sell'
                    })
                });
                console.log(response);
                const data = await response.json();
                handleJsonResponse(data, 'result');
            } catch (error) {
                document.getElementById('result').textContent = new Date().toLocaleString() + ': Ошибка: ' + error.message;
            }
        }

        async function getWeight() {
            try {
                console.log('getWeight');
                const response = await fetch(`${API_URL}/api/get-weight`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({})

        async function cashIn() {
            try {
                console.log('cashIn');
                const response = await fetch(`${API_URL}/api/cash-in`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },

                const data = await response.json();

        async function cashOut() {
            try {
                console.log('cashOut');
                const response = await fetch(`${API_URL}/api/cash-out`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cashier: 'Иван Иванов',

                    })

                const data = await response.json();

            } catch (error) {
                document.getElementById('result').textContent = new Date().toLocaleString() + ': Ошибка: ' + error.message;

        }

        async function printBankSlip() {
            try {
                if (savedSlipLines.length === 0) {
                    document.getElementById('result').textContent = new Date().toLocaleString() + ': Ошибка: Нет сохраненного банковского слипа для печати. Выполните банковскую операцию сначала.';
                    return;
                }

                console.log('printBankSlip');
                const response = await fetch(`${API_URL}/api/print-bank-slip`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        slipLines: savedSlipLines // Используем сохраненные строки слипа
                    })
                });
                const data = await response.json();
                handleJsonResponse(data, 'result');

                if (data.success && data.data && data.data.success) {
                    savedSlipLines = []; // Очищаем сохраненные строки слипа только если операция на устройстве успешна
                    displaySavedSlip(); // Обновляем отображение, скрывая слип
                    console.log('Bank slip printed successfully. savedSlipLines cleared.');
                }
            } catch (error) {
                document.getElementById('result').textContent = new Date().toLocaleString() + ': Ошибка: ' + error.message;
            }
        }

        async function closeBankShift() {
            try {
                console.log('CloseShiftTerminal');
                const response = await fetch(`${API_URL}/api/bank-operation`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        operation: 'CloseShiftTerminal',
                        params: {}
                    })
                });
                const data = await response.json();
                handleJsonResponse(data, 'result');
                console.log('Response data for closeBankShift:', data);
                if (data.success && data.data && data.data.success && Array.isArray(data.data.response)) {
                    savedSlipLines = data.data.slipLines;
                    console.log('savedSlipLines after update (closeBankShift):', savedSlipLines);
                    displaySavedSlip();
                } else {
                    savedSlipLines = []; // Очищаем, если нет слипа или операция неуспешна
                    console.log('savedSlipLines cleared (closeBankShift):', savedSlipLines);
                    displaySavedSlip();
                }
            } catch (error) {
                document.getElementById('result').textContent = new Date().toLocaleString() + ': Ошибка: ' + error.message;
            }
        }

                const response = await fetch(`${API_URL}/api/bank-operation`, {

        async function getProgramVersion() {
            try {
                console.log('getProgramVersion');
                const response = await fetch(`${API_URL}/api/version`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const textResponse = await response.text();
                try {
                    const data = JSON.parse(textResponse);
                    handleJsonResponse(data, 'status_display');
                } catch (jsonError) {
                    // If it's not JSON, assume it's just the version string
                    document.getElementById('status_display').textContent = `Версия программы: ${textResponse}`;
                }
            } catch (error) {
                document.getElementById('status_display').textContent = new Date().toLocaleString() + `: Ошибка: Не удалось установить связь со службой печати чеков (${error.message})`;
            }
        }

        async function checkMark() {

                if (!markCode) {

                console.log('checkMark:', markCode);

        // Вызываем функцию при загрузке страницы и скрываем блок слипа по умолчанию

    </script>
